<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PayLock</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f7;color:#111;padding-bottom:110px;overflow-x:hidden}
.header{padding:20px 20px 6px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border:1.7px solid #111;border-radius:12px;display:flex;align-items:center;justify-content:center}
.brand{font-size:30px;font-weight:900;letter-spacing:-1px}
.greet{padding:0 20px 8px}.greet h2{font-size:21px;font-weight:700;text-transform:capitalize}.greet p{color:#777;font-size:12px}
.card{background:#fff;margin:12px;border-radius:20px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #eee}
.view{display:none}.view.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input{width:100%;padding:13px 14px;border:1px solid #e6e6e6;border-radius:12px;margin:7px 0;font-size:14px;background:#fafafa;outline:none}
.input:focus{border-color:#111;background:#fff}
.btn-primary{width:100%;background:#111;color:#fff;border:0;padding:13px;border-radius:13px;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
.btn-new{border:1px solid #e0e0e0;background:#fff;padding:7px 16px;border-radius:20px;font-weight:700;cursor:pointer;font-size:12px}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(235,235,235,.94);backdrop-filter:blur(18px);border-radius:30px;display:flex;gap:2px;padding:5px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;cursor:pointer;color:#777;min-width:56px}.nav button.active{background:#111;color:#fff}
.dropZone{border:2px dashed #111;border-radius:14px;padding:16px;text-align:center;background:#fafafa;margin:8px 0;cursor:pointer;font-size:13px}
.filePreview{background:#f0f0f0;border-radius:12px;padding:10px 12px;margin:8px 0;display:none;align-items:center;gap:10px;font-size:12px}.filePreview.show{display:flex}
.typeRow{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 10px}.typeBtn{padding:7px 13px;border:1px solid #ddd;border-radius:20px;background:#fff;font-size:11px;font-weight:700;cursor:pointer}.typeBtn.active{background:#111;color:#fff;border-color:#111}
.wordCount{font-size:11px;text-align:right;color:#999}
.productCard{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;margin:9px 0}
.orderTag{background:#fff3cd;color:#856404;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.seller-avatar{width:38px;height:38px;background:#111;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;text-transform:uppercase;flex-shrink:0}
#viewFileModal{position:fixed;inset:0;background:#f5f5f7;z-index:9999;display:none;flex-direction:column}
#viewFileBox{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;overflow:hidden;max-width:480px;margin:0 auto}
.product-hero{width:100%;height:320px;background:#111;position:relative;flex-shrink:0;overflow:hidden}
.product-hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.6))}
.hero-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.hero-close{background:rgba(255,255,255,.96);border:0;width:34px;height:34px;border-radius:50%;font-weight:800;cursor:pointer}
.product-body{flex:1;overflow-y:auto;padding-bottom:120px}
.product-content{padding:16px 18px 0}
.price-main{font-size:30px;font-weight:900}
.product-title{font-size:20px;font-weight:900;margin:10px 0;line-height:1.25}
.product-desc{font-size:13px;line-height:1.6;color:#333;white-space:pre-wrap;margin:10px 0 16px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.meta-item{background:#f9f9fb;border:1px solid #eee;border-radius:12px;padding:10px}
.meta-label{font-size:9px;color:#888;text-transform:uppercase;font-weight:700}
.meta-value{font-size:12px;font-weight:700;margin-top:3px;word-break:break-all}

                                                                                                                                                                                                                                          </html>
